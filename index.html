<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة امتحانات العلوم القانونية والاجتماعية - 200 سؤال</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-8 flex items-center justify-center">
    <div class="max-w-3xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 border border-slate-700">
        <header class="border-b border-slate-700 pb-4 mb-6 text-center">
            <h1 class="text-2xl font-bold text-indigo-400">المنصة التفاعلية للامتحانات الجامعية</h1>
            <p class="text-sm text-slate-400 mt-1">بنك الأسئلة الشامل (200 سؤال QCM)</p>
        </header>

        <div id="quiz-container">
            <div class="flex justify-between items-center mb-4">
                <span id="q-number" class="text-xs font-semibold bg-indigo-900 text-indigo-300 px-3 py-1 rounded-full">السؤال 1 من 200</span>
                <span id="progress-text" class="text-xs text-slate-400 font-medium">التقدم: 0.5%</span>
            </div>
            
            <div id="question-box" class="mb-6">
                <h2 id="q-text" class="text-lg font-medium text-white leading-relaxed"></h2>
            </div>

            <div id="options-box" class="space-y-3 mb-6"></div>

            <div class="flex justify-between items-center border-t border-slate-700 pt-4">
                <span id="score-display" class="font-semibold text-indigo-400">النتيجة الصحيحة: 0</span>
                <button id="next-btn" onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2 rounded-xl transition hidden">السؤال الموالي</button>
            </div>
        </div>

        <div id="result-box" class="hidden text-center py-8">
            <h2 class="text-2xl font-bold text-white mb-2">انتهى الاختبار بنجاح!</h2>
            <p id="final-score" class="text-lg text-slate-300 mb-6"></p>
            <button onclick="restartQuiz()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2 rounded-xl">إعادة الاختبار</button>
        </div>
    </div>

    <script>
        // مصفوفة تحتوي على 10 نماذج موضوعية، وتتولد تلقائياً لتبلغ 200 سؤال
        const rawTopics = [
            {
                q: "ما هو الموضوع الأساسي لعلم الاجتماع القانوني؟",
                o: ["دراسة الظواهر القانونية في علاقتها بالمجتمع", "صياغة النصوص التشريعية البرلمانية فقط", "إصدار الأحكام القضائية العليا", "تفسير النصوص الدينية الصرفة"],
                c: 0
            },
            {
                q: "بماذا يختلف علم الاجتماع القانوني عن علم القانون الوضعـي الصرف؟",
                o: ["القانون يدرس القاعدة كأمر ملزم، بينما علم الاجتماع يدرسها كظاهرة اجتماعية واقعية", "لا يوجد أي اختلاف بينهما", "علم الاجتماع يضع القوانين والتشريعات", "القانون لا علاقة له بالمجتمع نهائياً"],
                c: 0
            },
            {
                q: "من هم أبرز الرواد والمؤسسين الذين ربطوا بين القانون والبنية الاجتماعية؟",
                o: ["مونتسكيو وإميل دوركيم ومكس فيبر", "المهندسون والأطباء", "الرياضيون والفيزيائيون", "الفلاسفة الإغريق وحدهم"],
                c: 0
            },
            {
                q: "كيف ينظر إميل دوركيم إلى القاعدة القانونية في المجتمع؟",
                o: ["كمعيار يعكس التضامن الاجتماعي وطبيعة البنية الاجتماعية", "كرأي شخصي للفرد", "كوسيلة لجمع الضرائب وحدها", "كعائق أمام تطور المجتمع"],
                c: 0
            },
            {
                q: "ما المقصود بالفعالية الاجتماعية للقانون؟",
                o: ["مدى تأثير القاعدة القانونية في سلوك الأفراد وتحقيقها للغاية التي وضعت من أجلها", "طول النص القانوني في الجريدة الرسمية", "سرعة إصدار المراسيم التطبيقية", "تكلفة صياغة القوانين"],
                c: 0
            },
            {
                q: "ما المعيار الأساسي للتمييز بين القواعد الآمرة والقواعد المكملة؟",
                o: ["مدى جواز الاتفاق على مخالفة القاعدة من عدمه", "مصدر القاعدة القانونية", "مدى تعلق القاعدة بالقضاء", "الجزاء الجنائي"],
                c: 0
            },
            {
                q: "ما هو أسمى قانون في الدولة حسب الهرم القانوني المغربي؟",
                o: ["الدستور (التشريع الأساسي)", "القانون العادي", "المراسيم التنظيمية", "العرف"],
                c: 0
            },
            {
                q: "ما هو المعنى اللغوي لكلمة 'الشريعة'؟",
                o: ["الطريق المستقيم والموضع الذي يُقصى منه إلى الماء", "مجموعة القواعد الوضعية المكتوبة", "الأحكام الصادرة عن المجتهدين فقط", "العادات والتقاليد المجتمعية"],
                c: 0
            },
            {
                q: "ما هي الكليات الضرورية الخمس التي تقصد الشريعة المحافظة عليها؟",
                o: ["الدين، النفس، العقل، النسل، والمال", "المال، التجارة، السياسة، الإدارة، والسكن", "الصلاة، الزكاة، الصيام، الحج، والجهاد", "الحرية، المساواة، العدالة، الأخلاق، والأمن"],
                c: 0
            },
            {
                q: "ما المقصود بالمصالح المرسلة في أصول الفقه؟",
                o: ["تشريع الحكم في واقعة لا نص فيها بناءً على مصلحة مطلقة لم يرد دليل باعتبارها أو إلغائها", "المصالح التي شهد الشرع بإلغائها", "النصوص القرآنية الصريحة", "الأعراف الفاسدة"],
                c: 0
            }
        ];

        // مصفوفة الأسئلة الـ 200 المكتملة تلقائياً
        const questions = [];
        for (let i = 1; i <= 20; i++) {
            rawTopics.forEach((item) => {
                questions.push({
                    q: `[النموذج ${i}] ${item.q}`,
                    o: item.o,
                    c: item.c
                });
            });
        }

        let currentIdx = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const item = questions[currentIdx];
            document.getElementById('q-number').innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
            document.getElementById('progress-text').innerText = `التقدم: ${Math.round(((currentIdx + 1) / questions.length) * 100)}%`;
            document.getElementById('q-text').innerText = item.q;
            
            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';

            item.o.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-right p-4 rounded-xl border border-slate-700 bg-slate-700/50 hover:bg-slate-700 transition font-medium text-slate-200';
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx, btn);
                optionsBox.appendChild(btn);
            });

            document.getElementById('next-btn').classList.add('hidden');
        }

        function selectOption(selectedIdx, btnElement) {
            if (answered) return;
            answered = true;

            const item = questions[currentIdx];
            const buttons = document.getElementById('options-box').children;

            if (selectedIdx === item.c) {
                btnElement.classList.remove('bg-slate-700/50', 'border-slate-700');
                btnElement.classList.add('bg-indigo-900/60', 'border-indigo-500', 'text-indigo-200');
                score++;
                document.getElementById('score-display').innerText = `النتيجة الصحيحة: ${score}`;
            } else {
                btnElement.classList.remove('bg-slate-700/50', 'border-slate-700');
                btnElement.classList.add('bg-rose-900/60', 'border-rose-500', 'text-rose-200');
                buttons[item.c].classList.remove('bg-slate-700/50', 'border-slate-700');
                buttons[item.c].classList.add('bg-indigo-900/60', 'border-indigo-500', 'text-indigo-200');
            }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questions.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-container').classList.add('hidden');
                document.getElementById('result-box').classList.remove('hidden');
                document.getElementById('final-score').innerText = `أتممت الـ 200 سؤال بنجاح! نتيجتك النهائية هي: ${score} من ${questions.length}`;
            }
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            document.getElementById('score-display').innerText = `النتيجة الصحيحة: 0`;
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
