<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك أسئلة علم الاجتماع القانوني</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-8 flex items-center justify-center">
    <div class="max-w-3xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 border border-slate-700">
        <header class="border-b border-slate-700 pb-4 mb-6 text-center">
            <h1 class="text-2xl font-bold text-indigo-400">امتحانات مادة علم الاجتماع القانوني</h1>
            <p class="text-sm text-slate-400 mt-1">المحاكاة الجامعية المغربية</p>
        </header>

        <div id="quiz-container">
            <div class="flex justify-between items-center mb-4">
                <span id="q-number" class="text-xs font-semibold bg-indigo-900 text-indigo-300 px-3 py-1 rounded-full">السؤال 1</span>
                <span id="progress-text" class="text-xs text-slate-400 font-medium"></span>
            </div>
            
            <div id="question-box" class="mb-6">
                <h2 id="q-text" class="text-lg font-medium text-white leading-relaxed"></h2>
            </div>

            <div id="options-box" class="space-y-3 mb-6"></div>

            <div class="flex justify-between items-center border-t border-slate-700 pt-4">
                <span id="score-display" class="font-semibold text-indigo-400">النتيجة الصحيحة: 0</span>
                <button id="next-btn" onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2 rounded-xl transition hidden">السؤال الموالي</button>
            </div>
        </div>

        <div id="result-box" class="hidden text-center py-8">
            <h2 class="text-2xl font-bold text-white mb-2">انتهى الاختبار بنجاح!</h2>
            <p id="final-score" class="text-lg text-slate-300 mb-6"></p>
            <button onclick="restartQuiz()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2 rounded-xl">إعادة الاختبار</button>
        </div>
    </div>

                c: 0
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const item = questions[currentIdx];
            document.getElementById('q-number').innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
            document.getElementById('progress-text').innerText = `التقدم: ${Math.round(((currentIdx + 1) / questions.length) * 100)}%`;
            document.getElementById('q-text').innerText = item.q;
            
            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';

            item.o.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-right p-4 rounded-xl border border-slate-700 bg-slate-700/50 hover:bg-slate-700 transition font-medium text-slate-200';
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx, btn);
                optionsBox.appendChild(btn);
            });

            document.getElementById('next-btn').classList.add('hidden');
        }

            if (answered) return;
            answered = true;

            const buttons = document.getElementById('options-box').children;
