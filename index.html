<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك أسئلة علم الاجتماع القانوني - 200 سؤال</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-8 flex items-center justify-center">
    <div class="max-w-3xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 border border-slate-700">
        <header class="border-b border-slate-700 pb-4 mb-6 text-center">
            <h1 class="text-2xl font-bold text-indigo-400">امتحانات مادة علم الاجتماع القانوني</h1>
            <p class="text-sm text-slate-400 mt-1">المحاكاة الجامعية المغربية (بنك الـ 200 سؤال الشامل)</p>
        </header>

        <div id="quiz-container">
            <div class="flex justify-between items-center mb-4">
                <span id="q-number" class="text-xs font-semibold bg-indigo-900 text-indigo-300 px-3 py-1 rounded-full">السؤال 1 من 200</span>
                <span id="progress-text" class="text-xs text-slate-400 font-medium">التقدم: 0.5%</span>
            </div>
            
            <div id="question-box" class="mb-6">
                <h2 id="q-text" class="text-lg font-medium text-white leading-relaxed"></h2>
            </div>

            <div id="options-box" class="space-y-3 mb-6"></div>

            <div class="flex justify-between items-center border-t border-slate-700 pt-4">
                <span id="score-display" class="font-semibold text-indigo-400">النتيجة الصحيحة: 0</span>
                <button id="next-btn" onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2 rounded-xl transition hidden">السؤال الموالي</button>
            </div>
        </div>

        <div id="result-box" class="hidden text-center py-8">
            <h2 class="text-2xl font-bold text-white mb-2">انتهى الاختبار بنجاح!</h2>
            <p id="final-score" class="text-lg text-slate-300 mb-6"></p>
            <button onclick="restartQuiz()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2 rounded-xl">إعادة الاختبار</button>
        </div>
    </div>

    <script>
        // قاعدة البيانات الأساسية الخاصة بمقرر علم الاجتماع القانوني
        const baseTopics = [
            {q: "ما هو الموضوع الأساسي لعلم الاجتماع القانوني؟", o: ["دراسة الظواهر القانونية في علاقتها بالمجتمع", "صياغة النصوص التشريعية البرلمانية فقط", "إصدار الأحكام القضائية العليا", "تفسير النصوص الدينية الصرفة"], c: 0},
            {q: "بماذا يختلف علم الاجتماع القانوني عن علم القانون الوضعـي الصرف؟", o: ["القانون يدرس القاعدة كأمر ملزم مفروض، بينما علم الاجتماع يدرسها كظاهرة اجتماعية واقعية", "لا يوجد أي اختلاف بينهما", "علم الاجتماع يضع القوانين والتشريعات", "القانون لا علاقة له بالمجتمع نهائياً"], c: 0},
            {q: "من هم أبرز الرواد والمؤسسين الذين ربطوا بين القانون والبنية الاجتماعية؟", o: ["مونتسكيو وإميل دوركيم ومكس فيبر", "المهندسون والأطباء", "الرياضيون والفيزيائيون", "الفلاسفة الإغريق وحدهم"], c: 0},
            {q: "كيف ينظر إميل دوركيم إلى القاعدة القانونية في المجتمع؟", o: ["كمعيار يعكس التضامن الاجتماعي وطبيعة البنية الاجتماعية", "كرأي شخصي للفرد", "كوسيلة لجمع الضرائب وحدها", "كعائق أمام تطور المجتمع"], c: 0},
            {q: "ما المقصود بالفعالية الاجتماعية للقانون؟", o: ["مدى تأثير القاعدة القانونية في سلوك الأفراد وتحقيقها للغاية التي وضعت من أجلها", "طول النص القانوني في الجريدة الرسمية", "سرعة إصدار المراسيم التطبيقية", "تكلفة صياغة القوانين"], c: 0},
            {q: "ما العلاقة بين التغير الاجتماعي والتغير القانوني؟", o: ["علاقة تبادلية وتأثير متبادل، فالمجتمع يطور قوانينه حسب مستجداته", "القانون يتغير بمعزل تام عن المجتمع", "المجتمع يبقى ثابتاً مهما تغير القانون", "لا توجد أي صلة بينهما"], c: 0},
            {q: "ما هو دور العرف في علم الاجتماع القانوني؟", o: ["يعتبر تعبيراً صادقاً عن ضمير الجماعة وتلقائية السلوك المستقر", "نص مكتوب يصدر عن البرلمان", "قرار إداري صادر عن الوزير", "حكم استثنائي مؤقت"], c: 0},
            {q: "ماذا يقصد بالوعي القانوني لدى الأفراد؟", o: ["دراية الأفراد بالقوانين ومدى احترامهم أو تمثلهم لها في حياتهم اليومية", "حفظ النصوص القانونية عن ظهر قلب", "العمل في السلك القضائي", "القدرة على الطعن في القرارات"], c: 0},
            {q: "كيف يفسر علم الاجتماع القانوني ظاهرة الجريمة؟", o: ["كظاهرة اجتماعية طبيعية ترتبط باختلالات البنية الاجتماعية والضبط", "كفعل فردي محض لا علاقة للمجتمع به", "كمشكلة بيولوجية بحتة", "كخطأ تقني في صياغة القوانين"],
